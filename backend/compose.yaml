services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_novel
      POSTGRES_USER: ai_novel
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?請先設定 backend/.env 的 POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_novel -d ai_novel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
